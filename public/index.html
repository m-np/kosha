<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kosha — Second Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg0: #0e0e0f;
  --bg1: #161618;
  --bg2: #1e1e21;
  --bg3: #28282c;
  --border: #2e2e32;
  --text0: #e8e6e1;
  --text1: #888884;
  --text2: #555552;
  --accent: #c8b560;
  --projects: #c8b560;
  --areas: #7a9e7e;
  --resources: #7a8eb5;
  --archive: #7a6b7a;
  --danger: #b56a6a;
  --radius: 6px;
}

html, body { height: 100%; background: var(--bg0); color: var(--text0); font-family: 'DM Mono', monospace; font-size: 13px; overflow: hidden; }

/* ─── TOP BAR ─────────────────────────────────────────────────── */
#topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 0 16px; height: 48px;
  background: var(--bg1); border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#logo { font-family: 'Fraunces', serif; font-size: 18px; color: var(--accent); letter-spacing: -0.5px; white-space: nowrap; }
#search-wrap { position: relative; flex: 1; max-width: 320px; }
#search-input {
  width: 100%; background: var(--bg2); border: 1px solid var(--border);
  color: var(--text0); font-family: inherit; font-size: 12px;
  padding: 6px 10px; border-radius: var(--radius); outline: none;
  transition: border-color .15s;
}
#search-input:focus { border-color: var(--accent); }
#search-input::placeholder { color: var(--text2); }
#search-results {
  position: absolute; top: calc(100% + 4px); left: 0; right: 0;
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
  z-index: 100; max-height: 320px; overflow-y: auto; display: none;
}
.search-item {
  padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 2px;
}
.search-item:last-child { border-bottom: none; }
.search-item:hover { background: var(--bg3); }
.search-item-name { font-size: 12px; color: var(--text0); }
.search-item-meta { font-size: 11px; color: var(--text1); }
.search-item-preview { font-size: 11px; color: var(--text2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.tab-group { display: flex; gap: 2px; }
.tab {
  padding: 5px 14px; border-radius: var(--radius); cursor: pointer;
  font-family: inherit; font-size: 12px; border: 1px solid transparent;
  background: transparent; color: var(--text1); transition: all .15s;
}
.tab:hover { color: var(--text0); background: var(--bg2); }
.tab.active { color: var(--accent); border-color: var(--accent); background: transparent; }

.topbar-btn {
  padding: 5px 12px; border-radius: var(--radius); cursor: pointer;
  font-family: inherit; font-size: 12px; border: 1px solid var(--border);
  background: var(--bg2); color: var(--text0); transition: all .15s; white-space: nowrap;
}
.topbar-btn:hover { border-color: var(--accent); color: var(--accent); }
.topbar-btn.icon-btn { padding: 5px 10px; }

#save-indicator { font-size: 11px; color: var(--text2); min-width: 60px; text-align: right; }

/* ─── LAYOUT ──────────────────────────────────────────────────── */
#app { display: flex; height: calc(100vh - 48px); }

/* ─── SIDEBAR ─────────────────────────────────────────────────── */
#sidebar {
  width: 260px; flex-shrink: 0;
  background: var(--bg1); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; overflow: hidden;
}
#sidebar-body { flex: 1; overflow-y: auto; padding: 8px 0; }
.folder-section { margin-bottom: 4px; }
.folder-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 12px; cursor: pointer; user-select: none;
  font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em;
  border-radius: 0;
}
.folder-header:hover { background: var(--bg2); }
.folder-header-left { display: flex; align-items: center; gap: 6px; }
.folder-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.folder-name { color: var(--text1); }
.folder-badge {
  font-size: 10px; color: var(--text2); background: var(--bg2);
  padding: 1px 6px; border-radius: 10px; margin-left: auto;
}
.folder-add-btn {
  opacity: 0; font-size: 16px; color: var(--text2); background: none; border: none;
  cursor: pointer; padding: 0 4px; line-height: 1; transition: opacity .15s, color .15s;
}
.folder-header:hover .folder-add-btn { opacity: 1; }
.folder-add-btn:hover { color: var(--accent); }
.folder-chevron { font-size: 10px; color: var(--text2); transition: transform .15s; }
.folder-chevron.open { transform: rotate(90deg); }

.note-list { padding: 2px 0; }
.note-item {
  padding: 5px 12px 5px 28px; cursor: pointer; font-size: 12px;
  color: var(--text1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  border-left: 2px solid transparent; transition: all .1s;
}
.note-item:hover { color: var(--text0); background: var(--bg2); }
.note-item.active { color: var(--text0); border-left-color: var(--accent); background: var(--bg2); }

#sidebar-footer {
  padding: 10px 14px; border-top: 1px solid var(--border);
  font-size: 11px; color: var(--text2);
}

/* ─── MAIN CONTENT ────────────────────────────────────────────── */
#main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

/* ─── EDITOR VIEW ─────────────────────────────────────────────── */
#editor-view { flex: 1; display: flex; overflow: hidden; }
#editor-pane {
  flex: 1; display: flex; flex-direction: column; min-width: 0;
  background: var(--bg0);
}
#editor-header {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 20px 8px; border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
#note-title {
  flex: 1; background: none; border: none; outline: none;
  font-family: 'Fraunces', serif; font-size: 22px; font-weight: 400;
  color: var(--text0); letter-spacing: -0.3px;
}
#note-title::placeholder { color: var(--text2); }
#folder-select {
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--text1); font-family: inherit; font-size: 11px;
  padding: 4px 8px; outline: none; cursor: pointer;
}
#folder-select:focus { border-color: var(--accent); }
.delete-btn {
  padding: 4px 10px; background: none; border: 1px solid transparent;
  border-radius: var(--radius); color: var(--text2); font-family: inherit;
  font-size: 11px; cursor: pointer; transition: all .15s;
}
.delete-btn:hover { border-color: var(--danger); color: var(--danger); }

#editor-area { flex: 1; display: flex; overflow: hidden; }
#note-content {
  width: 100%; height: 100%; background: var(--bg0);
  border: none; outline: none; resize: none; padding: 20px;
  font-family: 'DM Mono', monospace; font-size: 13px;
  line-height: 1.7; color: var(--text0); tab-size: 2;
}
#note-content::placeholder { color: var(--text2); }

/* ─── SPLIT PREVIEW ───────────────────────────────────────────── */
#preview-pane {
  width: 50%; flex-shrink: 0;
  border-left: 1px solid var(--border);
  background: var(--bg1); display: none; flex-direction: column; overflow: hidden;
}
#preview-pane.visible { display: flex; }
#preview-header {
  padding: 10px 16px; border-bottom: 1px solid var(--border);
  font-size: 11px; color: var(--text2); text-transform: uppercase; letter-spacing: .06em;
  flex-shrink: 0;
}
#preview-body {
  flex: 1; overflow-y: auto; padding: 20px 24px;
  font-family: 'DM Mono', monospace; font-size: 13px; line-height: 1.8;
  color: var(--text0);
}

/* Markdown preview styles */
#preview-body h1 { font-family: 'Fraunces', serif; font-size: 24px; font-weight: 400; color: var(--text0); margin: 0 0 16px; letter-spacing: -.3px; }
#preview-body h2 { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 400; color: var(--text0); margin: 24px 0 10px; }
#preview-body h3 { font-size: 14px; color: var(--text0); margin: 18px 0 8px; font-weight: 500; }
#preview-body p { margin: 0 0 12px; }
#preview-body strong { color: var(--text0); font-weight: 500; }
#preview-body em { font-style: italic; color: var(--text1); }
#preview-body code { background: var(--bg2); padding: 1px 5px; border-radius: 3px; font-size: 12px; color: var(--accent); }
#preview-body pre { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin: 12px 0; overflow-x: auto; }
#preview-body pre code { background: none; padding: 0; color: var(--text0); }
#preview-body blockquote { border-left: 3px solid var(--accent); padding-left: 14px; margin: 12px 0; color: var(--text1); }
#preview-body ul, #preview-body ol { padding-left: 20px; margin: 0 0 12px; }
#preview-body li { margin: 4px 0; }
#preview-body hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
#preview-body a { color: var(--accent); text-decoration: none; }
#preview-body a:hover { text-decoration: underline; }
.wikilink { color: var(--resources); cursor: pointer; border-bottom: 1px dashed var(--resources); }
.wikilink:hover { color: var(--text0); }
.task-check { width: 13px; height: 13px; margin-right: 6px; accent-color: var(--accent); }

/* ─── GRAPH VIEW ──────────────────────────────────────────────── */
#graph-view {
  flex: 1; display: none; flex-direction: column;
  background: var(--bg0); position: relative;
}
#graph-view.active { display: flex; }
#graph-svg { flex: 1; width: 100%; }
#graph-legend {
  position: absolute; bottom: 20px; left: 20px;
  background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px 16px;
  display: flex; flex-direction: column; gap: 8px; pointer-events: none;
}
.legend-item { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--text1); }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

/* ─── EMPTY STATE ─────────────────────────────────────────────── */
#empty-state {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 12px; color: var(--text2);
}
#empty-state h2 { font-family: 'Fraunces', serif; font-size: 22px; font-weight: 300; color: var(--text1); }
#empty-state p { font-size: 12px; text-align: center; max-width: 260px; line-height: 1.7; }

/* ─── MODAL ───────────────────────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.65);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; backdrop-filter: blur(2px);
}
.modal-overlay.hidden { display: none; }
.modal {
  background: var(--bg1); border: 1px solid var(--border);
  border-radius: 10px; padding: 24px; min-width: 380px; max-width: 480px;
  display: flex; flex-direction: column; gap: 16px;
  box-shadow: 0 24px 48px rgba(0,0,0,.5);
}
.modal h3 { font-family: 'Fraunces', serif; font-size: 18px; font-weight: 400; color: var(--text0); }
.modal-field { display: flex; flex-direction: column; gap: 6px; }
.modal-field label { font-size: 11px; color: var(--text1); text-transform: uppercase; letter-spacing: .06em; }
.modal-input {
  background: var(--bg0); border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--text0); font-family: inherit; font-size: 13px;
  padding: 8px 12px; outline: none; width: 100%;
}
.modal-input:focus { border-color: var(--accent); }
.modal-select {
  background: var(--bg0); border: 1px solid var(--border); border-radius: var(--radius);
  color: var(--text0); font-family: inherit; font-size: 13px;
  padding: 8px 12px; outline: none; width: 100%; cursor: pointer;
}
.modal-select:focus { border-color: var(--accent); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
.btn-primary {
  padding: 8px 20px; background: var(--accent); color: var(--bg0);
  border: none; border-radius: var(--radius); font-family: inherit;
  font-size: 13px; font-weight: 500; cursor: pointer; transition: opacity .15s;
}
.btn-primary:hover { opacity: .85; }
.btn-ghost {
  padding: 8px 16px; background: none; color: var(--text1);
  border: 1px solid var(--border); border-radius: var(--radius);
  font-family: inherit; font-size: 13px; cursor: pointer; transition: all .15s;
}
.btn-ghost:hover { color: var(--text0); border-color: var(--text1); }

/* ─── CONFIRM DIALOG ──────────────────────────────────────────── */
#confirm-overlay .modal { min-width: 300px; }
#confirm-overlay p { font-size: 13px; color: var(--text1); }
#confirm-delete-btn { background: var(--danger); }

/* ─── SCROLLBAR ───────────────────────────────────────────────── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text2); }

/* ─── GRAPH TOOLTIP ───────────────────────────────────────────── */
#graph-tooltip {
  position: fixed; background: var(--bg2); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 6px 12px; font-size: 12px;
  color: var(--text0); pointer-events: none; opacity: 0;
  transition: opacity .1s; z-index: 50;
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <div id="logo">kosha</div>

  <div id="search-wrap">
    <input id="search-input" type="text" placeholder="Search notes… (⌘K)" autocomplete="off">
    <div id="search-results"></div>
  </div>

  <div class="tab-group">
    <button class="tab active" id="tab-editor" onclick="switchView('editor')">Editor</button>
    <button class="tab" id="tab-graph" onclick="switchView('graph')">Graph</button>
  </div>

  <button class="topbar-btn" onclick="openTemplateModal()">+ Template</button>
  <button class="topbar-btn" onclick="openNewNoteModal()">+ Note</button>
  <button class="topbar-btn icon-btn" id="split-btn" title="Toggle split preview (⌘⇧P)" onclick="toggleSplit()">⇥</button>

  <span id="save-indicator"></span>
</div>

<!-- APP -->
<div id="app">

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div id="sidebar-body" id="sidebar-body"></div>
    <div id="sidebar-footer">0 notes</div>
  </div>

  <!-- MAIN -->
  <div id="main">

    <!-- EDITOR VIEW -->
    <div id="editor-view">
      <!-- Empty state shown when no note is open -->
      <div id="empty-state">
        <h2>Nothing open</h2>
        <p>Pick a note from the sidebar, search with ⌘K, or create a new note with ⌘N.</p>
      </div>

      <!-- Editor pane -->
      <div id="editor-pane" style="display:none; flex-direction:column; overflow:hidden;">
        <div id="editor-header">
          <input id="note-title" type="text" placeholder="Untitled">
          <select id="folder-select">
            <option value="Projects">Projects</option>
            <option value="Areas">Areas</option>
            <option value="Resources">Resources</option>
            <option value="Archive">Archive</option>
          </select>
          <button class="delete-btn" onclick="confirmDelete()">Delete</button>
        </div>
        <div id="editor-area">
          <textarea id="note-content" placeholder="Start writing… use [[note name]] to link notes"></textarea>
        </div>
      </div>

      <!-- Split preview -->
      <div id="preview-pane">
        <div id="preview-header">Preview</div>
        <div id="preview-body"></div>
      </div>
    </div>

    <!-- GRAPH VIEW -->
    <div id="graph-view">
      <svg id="graph-svg"></svg>
      <div id="graph-legend">
        <div class="legend-item"><div class="legend-dot" style="background:var(--projects)"></div>Projects</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--areas)"></div>Areas</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--resources)"></div>Resources</div>
        <div class="legend-item"><div class="legend-dot" style="background:var(--archive)"></div>Archive</div>
      </div>
    </div>

  </div>
</div>

<!-- NEW NOTE MODAL -->
<div class="modal-overlay hidden" id="new-note-overlay">
  <div class="modal">
    <h3>New Note</h3>
    <div class="modal-field">
      <label>Title</label>
      <input class="modal-input" id="new-note-title" type="text" placeholder="Note title">
    </div>
    <div class="modal-field">
      <label>Folder</label>
      <select class="modal-select" id="new-note-folder">
        <option value="Projects">Projects</option>
        <option value="Areas">Areas</option>
        <option value="Resources">Resources</option>
        <option value="Archive">Archive</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal('new-note-overlay')">Cancel</button>
      <button class="btn-primary" onclick="createNote()">Create</button>
    </div>
  </div>
</div>

<!-- TEMPLATE MODAL -->
<div class="modal-overlay hidden" id="template-overlay">
  <div class="modal">
    <h3>New from Template</h3>
    <div class="modal-field">
      <label>Title</label>
      <input class="modal-input" id="tmpl-title" type="text" placeholder="Note title">
    </div>
    <div class="modal-field">
      <label>Folder</label>
      <select class="modal-select" id="tmpl-folder">
        <option value="Projects">Projects</option>
        <option value="Areas">Areas</option>
        <option value="Resources">Resources</option>
        <option value="Archive">Archive</option>
      </select>
    </div>
    <div class="modal-field">
      <label>Template</label>
      <select class="modal-select" id="tmpl-select"></select>
    </div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal('template-overlay')">Cancel</button>
      <button class="btn-primary" onclick="createFromTemplate()">Create</button>
    </div>
  </div>
</div>

<!-- CONFIRM DELETE MODAL -->
<div class="modal-overlay hidden" id="confirm-overlay">
  <div class="modal">
    <h3>Delete Note</h3>
    <p id="confirm-msg">Are you sure you want to delete this note? This cannot be undone.</p>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal('confirm-overlay')">Cancel</button>
      <button class="btn-primary" id="confirm-delete-btn" onclick="deleteNote()">Delete</button>
    </div>
  </div>
</div>

<!-- GRAPH TOOLTIP -->
<div id="graph-tooltip"></div>

<script>
// ─── STATE ────────────────────────────────────────────────────────────────────
const state = {
  notes: {},           // { folder: [{name, modified}] }
  currentNote: null,   // { name, folder }
  splitVisible: false,
  view: 'editor',
  templates: [],
  autosaveTimer: null,
  dirty: false,
};

const FOLDER_COLORS = {
  Projects: '#c8b560',
  Areas: '#7a9e7e',
  Resources: '#7a8eb5',
  Archive: '#7a6b7a',
};

// ─── INIT ─────────────────────────────────────────────────────────────────────
async function init() {
  await loadNotes();
  await loadTemplates();
  setupSearch();
  setupKeyboard();
  setupEditorEvents();
}

// ─── NOTES ────────────────────────────────────────────────────────────────────
async function loadNotes() {
  const res = await fetch('/api/notes');
  state.notes = await res.json();
  renderSidebar();
}

function renderSidebar() {
  const body = document.getElementById('sidebar-body');
  const folders = ['Projects', 'Areas', 'Resources', 'Archive'];
  let total = 0;

  body.innerHTML = '';
  for (const folder of folders) {
    const noteList = state.notes[folder] || [];
    total += noteList.length;
    const color = FOLDER_COLORS[folder];

    const isOpen = body.querySelector(`[data-folder="${folder}"]`)?.classList.contains('open') !== false;

    const section = document.createElement('div');
    section.className = 'folder-section';

    const header = document.createElement('div');
    header.className = 'folder-header';
    header.dataset.folder = folder;
    header.innerHTML = `
      <div class="folder-header-left">
        <div class="folder-chevron open" style="color:${color}">▶</div>
        <div class="folder-dot" style="background:${color}"></div>
        <span class="folder-name" style="color:${color}">${folder}</span>
      </div>
      <span class="folder-badge">${noteList.length}</span>
      <button class="folder-add-btn" title="New note in ${folder}">+</button>
    `;

    const list = document.createElement('div');
    list.className = 'note-list';
    list.dataset.folder = folder;

    for (const note of noteList) {
      const item = document.createElement('div');
      item.className = 'note-item';
      if (state.currentNote && state.currentNote.name === note.name && state.currentNote.folder === folder) {
        item.classList.add('active');
      }
      item.textContent = note.name;
      item.dataset.name = note.name;
      item.dataset.folder = folder;
      item.onclick = () => openNote(folder, note.name);
      list.appendChild(item);
    }

    header.querySelector('.folder-add-btn').onclick = (e) => {
      e.stopPropagation();
      openNewNoteModal(folder);
    };

    header.onclick = (e) => {
      if (e.target.classList.contains('folder-add-btn')) return;
      const chevron = header.querySelector('.folder-chevron');
      const visible = list.style.display !== 'none';
      list.style.display = visible ? 'none' : '';
      chevron.classList.toggle('open', !visible);
    };

    section.appendChild(header);
    section.appendChild(list);
    body.appendChild(section);
  }

  document.getElementById('sidebar-footer').textContent = `${total} note${total !== 1 ? 's' : ''}`;
}

async function openNote(folder, name) {
  // Save current note before switching
  if (state.currentNote && state.dirty) {
    await saveCurrentNote();
  }

  state.currentNote = { folder, name };
  state.dirty = false;

  const res = await fetch(`/api/notes/${encodeURIComponent(folder)}/${encodeURIComponent(name)}`);
  if (!res.ok) { alert('Could not load note'); return; }
  const data = await res.json();

  showEditorPane();
  document.getElementById('note-title').value = name;
  document.getElementById('folder-select').value = folder;
  document.getElementById('note-content').value = data.content;

  renderSidebar();
  if (state.splitVisible) renderPreview();
  setSaveIndicator('');
}

function showEditorPane() {
  document.getElementById('empty-state').style.display = 'none';
  const pane = document.getElementById('editor-pane');
  pane.style.display = 'flex';
  pane.style.flexDirection = 'column';
  pane.style.overflow = 'hidden';
  pane.style.flex = '1';
}

// ─── SAVE ─────────────────────────────────────────────────────────────────────
function setupEditorEvents() {
  const title = document.getElementById('note-title');
  const content = document.getElementById('note-content');
  const folderSelect = document.getElementById('folder-select');

  content.addEventListener('input', () => {
    state.dirty = true;
    scheduleAutosave();
    if (state.splitVisible) renderPreview();
  });

  title.addEventListener('input', () => {
    state.dirty = true;
  });

  folderSelect.addEventListener('change', async () => {
    if (!state.currentNote) return;
    const newFolder = folderSelect.value;
    if (newFolder === state.currentNote.folder) return;
    await moveCurrentNote(newFolder);
  });
}

function scheduleAutosave() {
  setSaveIndicator('saving…');
  clearTimeout(state.autosaveTimer);
  state.autosaveTimer = setTimeout(saveCurrentNote, 1200);
}

async function saveCurrentNote() {
  if (!state.currentNote) return;
  clearTimeout(state.autosaveTimer);

  const name = document.getElementById('note-title').value.trim();
  const content = document.getElementById('note-content').value;
  const folder = state.currentNote.folder;

  if (!name) { setSaveIndicator('no title'); return; }

  // Rename if title changed
  if (name !== state.currentNote.name) {
    // Save as new name, delete old
    const oldName = state.currentNote.name;
    const res = await fetch(`/api/notes/${encodeURIComponent(folder)}/${encodeURIComponent(name)}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content }),
    });
    if (!res.ok) { setSaveIndicator('error'); return; }
    await fetch(`/api/notes/${encodeURIComponent(folder)}/${encodeURIComponent(oldName)}`, { method: 'DELETE' });
    state.currentNote.name = name;
  } else {
    const res = await fetch(`/api/notes/${encodeURIComponent(folder)}/${encodeURIComponent(name)}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content }),
    });
    if (!res.ok) { setSaveIndicator('error'); return; }
  }

  state.dirty = false;
  setSaveIndicator('saved ✓');
  setTimeout(() => setSaveIndicator(''), 2000);
  await loadNotes();
}

async function moveCurrentNote(newFolder) {
  if (!state.currentNote) return;
  // Save first
  await saveCurrentNote();
  const name = state.currentNote.name;
  const fromFolder = state.currentNote.folder;
  const res = await fetch('/api/move', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, fromFolder, toFolder: newFolder }),
  });
  if (!res.ok) { const e = await res.json(); alert(e.error || 'Move failed'); return; }
  state.currentNote.folder = newFolder;
  await loadNotes();
  renderSidebar();
}

function setSaveIndicator(msg) {
  document.getElementById('save-indicator').textContent = msg;
}

// ─── DELETE ───────────────────────────────────────────────────────────────────
function confirmDelete() {
  if (!state.currentNote) return;
  document.getElementById('confirm-msg').textContent =
    `Delete "${state.currentNote.name}"? This cannot be undone.`;
  openModal('confirm-overlay');
}

async function deleteNote() {
  if (!state.currentNote) return;
  const { folder, name } = state.currentNote;
  closeModal('confirm-overlay');
  await fetch(`/api/notes/${encodeURIComponent(folder)}/${encodeURIComponent(name)}`, { method: 'DELETE' });
  state.currentNote = null;
  state.dirty = false;
  document.getElementById('editor-pane').style.display = 'none';
  document.getElementById('empty-state').style.display = '';
  document.getElementById('note-title').value = '';
  document.getElementById('note-content').value = '';
  await loadNotes();
}

// ─── CREATE NOTE ──────────────────────────────────────────────────────────────
function openNewNoteModal(folder) {
  document.getElementById('new-note-title').value = '';
  if (folder) document.getElementById('new-note-folder').value = folder;
  openModal('new-note-overlay');
  setTimeout(() => document.getElementById('new-note-title').focus(), 50);
}

async function createNote() {
  const name = document.getElementById('new-note-title').value.trim();
  const folder = document.getElementById('new-note-folder').value;
  if (!name) { document.getElementById('new-note-title').focus(); return; }
  closeModal('new-note-overlay');
  await fetch(`/api/notes/${encodeURIComponent(folder)}/${encodeURIComponent(name)}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ content: '' }),
  });
  await loadNotes();
  await openNote(folder, name);
}

// ─── TEMPLATES ────────────────────────────────────────────────────────────────
async function loadTemplates() {
  const res = await fetch('/api/templates');
  state.templates = await res.json();
  const sel = document.getElementById('tmpl-select');
  sel.innerHTML = state.templates.map(t => `<option value="${t.name}">${t.name}</option>`).join('');
}

function openTemplateModal() {
  document.getElementById('tmpl-title').value = '';
  openModal('template-overlay');
  setTimeout(() => document.getElementById('tmpl-title').focus(), 50);
}

async function createFromTemplate() {
  const name = document.getElementById('tmpl-title').value.trim();
  const folder = document.getElementById('tmpl-folder').value;
  const tmplName = document.getElementById('tmpl-select').value;
  if (!name) { document.getElementById('tmpl-title').focus(); return; }

  const tmpl = state.templates.find(t => t.name === tmplName);
  if (!tmpl) return;

  const today = new Date().toISOString().split('T')[0];
  const content = tmpl.content
    .replace(/\{\{title\}\}/g, name)
    .replace(/\{\{date\}\}/g, today);

  closeModal('template-overlay');
  await fetch(`/api/notes/${encodeURIComponent(folder)}/${encodeURIComponent(name)}`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ content }),
  });
  await loadNotes();
  await openNote(folder, name);
}

// ─── SEARCH ───────────────────────────────────────────────────────────────────
function setupSearch() {
  const input = document.getElementById('search-input');
  const results = document.getElementById('search-results');
  let debounce = null;

  input.addEventListener('input', () => {
    clearTimeout(debounce);
    const q = input.value.trim();
    if (!q) { results.style.display = 'none'; return; }
    debounce = setTimeout(() => doSearch(q), 250);
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      input.value = '';
      results.style.display = 'none';
      input.blur();
    }
  });

  document.addEventListener('click', (e) => {
    if (!e.target.closest('#search-wrap')) {
      results.style.display = 'none';
    }
  });
}

async function doSearch(q) {
  const res = await fetch(`/api/search?q=${encodeURIComponent(q)}`);
  const items = await res.json();
  const results = document.getElementById('search-results');

  if (!items.length) {
    results.innerHTML = '<div class="search-item"><span class="search-item-meta">No results</span></div>';
    results.style.display = 'block';
    return;
  }

  results.innerHTML = items.map(item => `
    <div class="search-item" onclick="selectSearchResult('${item.folder}','${escAttr(item.name)}')">
      <span class="search-item-name">${escHtml(item.name)}</span>
      <span class="search-item-meta" style="color:${FOLDER_COLORS[item.folder]}">${item.folder}</span>
      <span class="search-item-preview">${escHtml(item.preview)}</span>
    </div>
  `).join('');
  results.style.display = 'block';
}

async function selectSearchResult(folder, name) {
  document.getElementById('search-input').value = '';
  document.getElementById('search-results').style.display = 'none';
  if (state.view === 'graph') switchView('editor');
  await openNote(folder, name);
}

// ─── MARKDOWN PREVIEW ─────────────────────────────────────────────────────────
function renderPreview() {
  const raw = document.getElementById('note-content').value;
  document.getElementById('preview-body').innerHTML = parseMarkdown(raw);
  // Attach wikilink clicks
  document.querySelectorAll('.wikilink').forEach(el => {
    el.addEventListener('click', async () => {
      const target = el.dataset.target;
      // Find note by name across all folders
      for (const [folder, notes] of Object.entries(state.notes)) {
        if (notes.find(n => n.name === target)) {
          if (state.view === 'graph') switchView('editor');
          await openNote(folder, target);
          return;
        }
      }
      alert(`Note "${target}" not found.`);
    });
  });
}

function parseMarkdown(md) {
  let html = escHtml(md);

  // Code blocks (before inline code)
  html = html.replace(/```[\s\S]*?```/g, m => {
    const inner = m.slice(3, -3).replace(/^[a-z]*\n/, '');
    return `<pre><code>${inner}</code></pre>`;
  });

  // Inline code
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

  // Headings
  html = html.replace(/^######\s(.+)$/gm, '<h6>$1</h6>');
  html = html.replace(/^#####\s(.+)$/gm, '<h5>$1</h5>');
  html = html.replace(/^####\s(.+)$/gm, '<h4>$1</h4>');
  html = html.replace(/^###\s(.+)$/gm, '<h3>$1</h3>');
  html = html.replace(/^##\s(.+)$/gm, '<h2>$1</h2>');
  html = html.replace(/^#\s(.+)$/gm, '<h1>$1</h1>');

  // Blockquotes
  html = html.replace(/^&gt;\s(.+)$/gm, '<blockquote>$1</blockquote>');

  // HR
  html = html.replace(/^---+$/gm, '<hr>');

  // Checkboxes
  html = html.replace(/^- \[ \]\s(.+)$/gm, '<li><input type="checkbox" class="task-check" disabled> $1</li>');
  html = html.replace(/^- \[x\]\s(.+)$/gim, '<li><input type="checkbox" class="task-check" checked disabled> $1</li>');

  // Unordered lists
  html = html.replace(/^[-*]\s(.+)$/gm, '<li>$1</li>');

  // Ordered lists
  html = html.replace(/^\d+\.\s(.+)$/gm, '<li>$1</li>');

  // Wrap consecutive <li> in <ul>
  html = html.replace(/(<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`);

  // Bold + italic
  html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  html = html.replace(/__(.+?)__/g, '<strong>$1</strong>');
  html = html.replace(/_(.+?)_/g, '<em>$1</em>');

  // Hyperlinks
  html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  // Wikilinks
  html = html.replace(/\[\[([^\]]+)\]\]/g, (_, target) =>
    `<span class="wikilink" data-target="${escAttr(target)}">[[${escHtml(target)}]]</span>`);

  // Paragraphs: wrap lines not already wrapped in a block element
  const blockTags = /^<(h[1-6]|ul|ol|li|pre|blockquote|hr)/;
  const lines = html.split('\n');
  const out = [];
  for (const line of lines) {
    if (line === '' || blockTags.test(line)) {
      out.push(line);
    } else {
      out.push(`<p>${line}</p>`);
    }
  }
  return out.join('\n');
}

function toggleSplit() {
  state.splitVisible = !state.splitVisible;
  const pane = document.getElementById('preview-pane');
  pane.classList.toggle('visible', state.splitVisible);
  if (state.splitVisible) renderPreview();
}

// ─── GRAPH VIEW ───────────────────────────────────────────────────────────────
let graphSimulation = null;

async function loadGraph() {
  const res = await fetch('/api/graph');
  const data = await res.json();
  renderGraph(data);
}

function renderGraph({ nodes, links }) {
  const svg = document.getElementById('graph-svg');
  svg.innerHTML = '';

  const width = svg.clientWidth || 800;
  const height = svg.clientHeight || 600;

  const d3svg = d3.select('#graph-svg');
  const g = d3svg.append('g');

  // Zoom
  const zoom = d3.zoom().scaleExtent([0.2, 4]).on('zoom', e => g.attr('transform', e.transform));
  d3svg.call(zoom);

  // Tooltip
  const tooltip = document.getElementById('graph-tooltip');

  // Build link elements
  const link = g.append('g').selectAll('line')
    .data(links)
    .join('line')
    .attr('stroke', '#2e2e32')
    .attr('stroke-width', 1.5);

  // Node radius scaled by connections
  const maxLinks = Math.max(1, ...nodes.map(n => n.links));
  const radius = n => 5 + (n.links / maxLinks) * 12;

  const node = g.append('g').selectAll('circle')
    .data(nodes)
    .join('circle')
    .attr('r', radius)
    .attr('fill', n => FOLDER_COLORS[n.folder])
    .attr('stroke', '#0e0e0f')
    .attr('stroke-width', 1.5)
    .style('cursor', 'pointer')
    .on('mouseover', (event, n) => {
      tooltip.style.opacity = '1';
      tooltip.textContent = `${n.id} (${n.folder})`;
    })
    .on('mousemove', (event) => {
      tooltip.style.left = (event.clientX + 12) + 'px';
      tooltip.style.top = (event.clientY - 20) + 'px';
    })
    .on('mouseout', () => { tooltip.style.opacity = '0'; })
    .on('click', async (event, n) => {
      switchView('editor');
      await openNote(n.folder, n.id);
    })
    .call(d3.drag()
      .on('start', (event, n) => {
        if (!event.active) sim.alphaTarget(0.3).restart();
        n.fx = n.x; n.fy = n.y;
      })
      .on('drag', (event, n) => { n.fx = event.x; n.fy = event.y; })
      .on('end', (event, n) => {
        if (!event.active) sim.alphaTarget(0);
        n.fx = null; n.fy = null;
      })
    );

  const label = g.append('g').selectAll('text')
    .data(nodes)
    .join('text')
    .text(n => n.id)
    .attr('fill', '#888884')
    .attr('font-size', '11px')
    .attr('font-family', 'DM Mono, monospace')
    .attr('dx', n => radius(n) + 4)
    .attr('dy', '0.35em')
    .style('pointer-events', 'none');

  const sim = d3.forceSimulation(nodes)
    .force('link', d3.forceLink(links).id(n => n.id).distance(100))
    .force('charge', d3.forceManyBody().strength(-200))
    .force('center', d3.forceCenter(width / 2, height / 2))
    .force('collision', d3.forceCollide().radius(n => radius(n) + 8))
    .on('tick', () => {
      link.attr('x1', d => d.source.x).attr('y1', d => d.source.y)
          .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
      node.attr('cx', d => d.x).attr('cy', d => d.y);
      label.attr('x', d => d.x).attr('y', d => d.y);
    });

  graphSimulation = sim;
}

// ─── VIEW SWITCHING ───────────────────────────────────────────────────────────
function switchView(view) {
  state.view = view;
  document.getElementById('editor-view').style.display = view === 'editor' ? 'flex' : 'none';
  const gv = document.getElementById('graph-view');
  gv.classList.toggle('active', view === 'graph');
  document.getElementById('tab-editor').classList.toggle('active', view === 'editor');
  document.getElementById('tab-graph').classList.toggle('active', view === 'graph');
  if (view === 'graph') loadGraph();
}

// ─── MODALS ───────────────────────────────────────────────────────────────────
function openModal(id) {
  document.getElementById(id).classList.remove('hidden');
}
function closeModal(id) {
  document.getElementById(id).classList.add('hidden');
}

document.querySelectorAll('.modal-overlay').forEach(el => {
  el.addEventListener('click', e => {
    if (e.target === el) closeModal(el.id);
  });
});

// ─── KEYBOARD SHORTCUTS ───────────────────────────────────────────────────────
function setupKeyboard() {
  document.addEventListener('keydown', async (e) => {
    const mod = e.metaKey || e.ctrlKey;
    if (e.key === 'Escape') {
      document.querySelectorAll('.modal-overlay:not(.hidden)').forEach(m => {
        m.classList.add('hidden');
      });
      document.getElementById('search-input').value = '';
      document.getElementById('search-results').style.display = 'none';
      return;
    }
    if (mod && e.key === 'n') { e.preventDefault(); openNewNoteModal(); }
    if (mod && e.key === 'k') { e.preventDefault(); document.getElementById('search-input').focus(); }
    if (mod && e.key === 's') { e.preventDefault(); await saveCurrentNote(); }
    if (mod && e.shiftKey && e.key === 'P') { e.preventDefault(); toggleSplit(); }
  });

  // Enter in new-note modal
  document.getElementById('new-note-title').addEventListener('keydown', e => {
    if (e.key === 'Enter') createNote();
  });
  document.getElementById('tmpl-title').addEventListener('keydown', e => {
    if (e.key === 'Enter') createFromTemplate();
  });
}

// ─── UTILS ────────────────────────────────────────────────────────────────────
function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function escAttr(s) {
  return String(s).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

// ─── START ────────────────────────────────────────────────────────────────────
init();
</script>
